name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example1/package-lock.json

      - name: Install dependencies
        working-directory: example1
        run: npm ci

      - name: Run Biome check
        working-directory: example1
        run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example1/package-lock.json

      - name: Install dependencies
        working-directory: example1
        run: npm ci

      - name: Run tests
        working-directory: example1
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example1/package-lock.json

      - name: Install dependencies
        working-directory: example1
        run: npm ci

      - name: Build
        working-directory: example1
        run: npm run build
